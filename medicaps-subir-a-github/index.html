<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MediCaps · Gorros quirúrgicos</title>
<meta name="description" content="Gorros quirúrgicos antifluido con bordado personalizado. Pedidos por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: boutique editorial — banda de anuncio, header sticky con logo central, hero a dos columnas, catálogo en rejilla, cajones laterales para bolsa y administración */
:root{
  --bg:#FEFDFB; --surface:#FFFFFF; --band:#F8F5F1; --ink:#2C2A29; --muted:#6E6A66;
  --accent:#8C7A6B; --line:#EDE8E1; --wa:#1E8A52; --danger:#A3412F; --on-ink:#FAF8F5;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Jost", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1817; --surface:#232020; --band:#201D1B; --ink:#EEE8E1; --muted:#A79F97;
  --accent:#C4B09E; --line:#3A3532; --wa:#3DBB78; --danger:#E0816B; --on-ink:#1A1817; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1817; --surface:#232020; --band:#201D1B; --ink:#EEE8E1; --muted:#A79F97;
  --accent:#C4B09E; --line:#3A3532; --wa:#3DBB78; --danger:#E0816B; --on-ink:#1A1817; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--display)}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}

/* anuncio */
.announce{background:var(--ink);color:var(--on-ink);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding-block:9px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:76px;gap:12px}
.nav{display:flex;gap:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.nav button{color:var(--muted);padding-block:4px;border-bottom:1px solid transparent}
.nav button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.logo{text-align:center;cursor:pointer}
.logo h1{font-size:30px;line-height:1;letter-spacing:-.01em}
.logo p{margin:2px 0 0;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.actions{display:flex;justify-content:flex-end;gap:8px}
.bag-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.bag-btn .count{background:var(--accent);color:var(--on-ink);min-width:18px;height:18px;border-radius:9px;font-size:10px;display:grid;place-items:center;font-weight:600;padding:0 5px}
.admin-btn{border:1px dashed var(--accent);color:var(--accent);padding:9px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{background:var(--band);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:7fr 5fr;gap:56px;align-items:center;padding-block:72px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:5px 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero h2{font-size:clamp(38px,5.4vw,64px);line-height:1.06;margin:22px 0 18px}
.hero h2 em{color:var(--accent);font-weight:400}
.hero p.lead{color:var(--muted);max-width:52ch;font-weight:300;margin:0}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);transition:background .25s,color .25s,border-color .25s;text-decoration:none}
.btn-dark{background:var(--ink);color:var(--on-ink)}
.btn-dark:hover{background:var(--accent);border-color:var(--accent)}
.btn-line{color:var(--ink)}
.btn-line:hover{background:var(--surface)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.showcase{position:relative}
.showcase .frame{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);padding:26px}
.showcase .art{aspect-ratio:4/5;max-width:100%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;padding:24px;position:relative}
.showcase .ghost{position:absolute;inset:0;border:1px solid var(--accent);opacity:.45;transform:translate(14px,14px)}
.caption{position:absolute;left:14px;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);padding:10px;text-align:center}
.caption b{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:16px}
.caption span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}

/* catálogo */
.catalog{padding-block:64px}
.cat-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:22px;border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:40px}
.cat-head h3{font-size:clamp(30px,3.4vw,40px);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--accent)}
.search input{background:var(--surface);border:1px solid var(--line);padding:10px 12px 10px 34px;width:230px;max-width:100%;font-size:13px}
.search input:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;transition:box-shadow .3s}
.card:hover{box-shadow:0 18px 40px -24px rgba(44,42,41,.35)}
.card .vis{position:relative;aspect-ratio:4/3;background:color-mix(in srgb,var(--pc) 13%,var(--surface));display:grid;place-items:center;border-bottom:1px solid var(--line);overflow:hidden;cursor:pointer}
.card .vis svg{width:62%;transition:transform .5s}
.card .vis img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .vis svg,.card:hover .vis img{transform:scale(1.05)}
.tag{position:absolute;top:14px;left:14px;background:var(--surface);border:1px solid var(--line);padding:4px 9px;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.soldout{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--on-ink);padding:4px 9px;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.card .info{padding:20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h4{font-size:21px;line-height:1.15;margin-top:2px}
.price{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.card .desc{font-size:13px;color:var(--muted);font-weight:300;margin:0;border-top:1px solid var(--line);padding-top:10px}
.card .fabric{font-family:var(--display);font-style:italic;color:var(--accent);font-size:15px}
.card .foot{padding:0 22px 22px;display:grid;grid-template-columns:1fr auto;gap:8px}
.card .foot .btn{padding:12px 14px}
.empty{border:1px dashed var(--line);background:var(--surface);padding:56px 20px;text-align:center;color:var(--muted)}
.empty p{font-family:var(--display);font-size:20px;margin:0 0 12px}
.link{color:var(--accent);border-bottom:1px solid var(--accent);font-size:11px;letter-spacing:.18em;text-transform:uppercase}

.benefits{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-top:72px}
.benefits div{padding:40px 28px;text-align:center}
.benefits div+div{border-left:1px solid var(--line)}
.benefits .ico{width:24px;height:24px;color:var(--accent);margin-bottom:10px}
.benefits h5{font-family:var(--display);font-size:21px;font-weight:500;margin:0 0 6px}
.benefits p{font-size:13px;color:var(--muted);font-weight:300;margin:0 auto;max-width:34ch}

/* nosotros */
.about{max-width:720px;margin:0 auto;text-align:center;padding-block:80px}
.about h3{font-size:clamp(32px,4.4vw,50px);line-height:1.1;margin:14px 0 22px}
.about p{color:var(--muted);font-weight:300;white-space:pre-line}

footer{background:var(--band);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px;padding-block:40px}
footer h5{font-family:var(--display);font-size:24px;font-weight:500;margin:0}
footer small{color:var(--muted);font-size:12px}
.phone{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;user-select:all}

/* overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(26,24,23,.45);backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(460px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;box-shadow:-20px 0 50px -20px rgba(0,0,0,.35)}
.drawer.wide{width:min(620px,100%)}
.d-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.d-head h4{font-size:24px}
.x{padding:6px}
.d-body{flex:1;overflow-y:auto;padding-block:8px;min-height:0}
.line-item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.thumb{width:56px;height:56px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--pc) 16%,var(--surface))}
.thumb svg{width:80%}.thumb img{width:100%;height:100%;object-fit:cover}
.line-item h5{font-family:var(--display);font-size:17px;font-weight:500;margin:0;line-height:1.2}
.line-item .meta{font-size:11px;color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:6px}
.stepper button{width:28px;height:28px;display:grid;place-items:center}
.stepper span{min-width:24px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.remove{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:underline}
.d-foot{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total span:first-child{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.total span:last-child{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);padding:10px 12px;font-size:14px;width:100%}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.modal-wrap{position:fixed;inset:0;z-index:51;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{position:relative;background:var(--bg);border:1px solid var(--line);width:min(820px,100%);display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.modal .x{position:absolute;top:10px;right:10px}
.modal .vis{aspect-ratio:1;max-width:100%;background:color-mix(in srgb,var(--pc) 13%,var(--surface));border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.modal .vis svg{width:78%}.modal .vis img{width:100%;height:100%;object-fit:cover}
.modal .content{display:flex;flex-direction:column;gap:12px;min-width:0}
.modal h4{font-size:30px;line-height:1.1}
.modal .desc{color:var(--muted);font-weight:300;margin:0;font-size:14px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;border-block:1px solid var(--line);padding-block:10px}
.specs dt{color:var(--muted)}.specs dd{margin:0}

/* (panel de administración no se usa en esta versión) */
.tabs{display:flex;gap:4px;margin-top:14px}
.tabs button{padding:8px 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.status{font-size:12px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.dirty i{background:#C9852F}.status.ok i{background:var(--wa)}.status.err i{background:var(--danger)}
.adm-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.adm-row .thumb{width:48px;height:48px}
.adm-row b{font-family:var(--display);font-size:17px;font-weight:500;display:block;line-height:1.2}
.adm-row small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.adm-actions{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface);padding:6px 10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.mini.danger{color:var(--danger);border-color:var(--danger)}
.form{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box .thumb{width:72px;height:72px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.badge{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.preview-bar{background:#C9852F;color:#1A1817;text-align:center;font-size:12px;padding-block:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--on-ink);padding:11px 18px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:48px}
  .showcase{max-width:380px;width:100%;margin:0 auto}
  .modal{grid-template-columns:1fr}
  .benefits{grid-template-columns:1fr}
  .benefits div+div{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:640px){
  .top .wrap{grid-template-columns:auto 1fr auto;min-height:64px}
  .nav{gap:12px;font-size:10px;letter-spacing:.12em}
  .logo h1{font-size:23px}
  .logo p{display:none}
  .bag-btn .lbl,.admin-btn .lbl{display:none}
  .bag-btn,.admin-btn{padding:8px 10px}
  .grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .search input{width:100%}
  .search,.filters{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* Textos por defecto: se reemplazan con lo que guardas en /admin */
var CONFIG = {
  storeName: "MediCaps", tagline: "Haute Chirurgie", whatsapp: "+52 1 33 2201 4797", currency: "MXN",
  announcement: "Pedidos directos por WhatsApp", heroBadge: "Colección 2026",
  heroTitle: "La elegancia clásica también entra al quirófano.",
  heroText: "Gorros quirúrgicos ergonómicos, con telas antifluido e hipoalergénicas y confección artesanal para profesionales de la salud.",
  aboutTitle: "Hacemos de la indumentaria médica un oficio de sastre.", aboutText: ""
};

/* Productos de ejemplo (solo si la API no responde, p. ej. al abrir el archivo sin servidor) */
var SAMPLE = [
  {id:"p1",name:"Gorro Botanical",category:"Edición Limitada",price:320,color:"#4A5D4E",pattern:"Hojas de salvia",fabric:"Algodón orgánico antifluido",description:"Estampado de hojas en verde salvia. Ajuste trasero con cintas y botones salva-orejas.",tag:"Más vendido",image:"",available:true},
  {id:"p2",name:"Gorro Minimal Taupe",category:"Liso",price:280,color:"#8C7A6B",pattern:"Taupe mate",fabric:"Tejido stretch en 4 direcciones",description:"Liso, sobrio y muy ligero. Ideal para turnos largos.",tag:"Esencial",image:"",available:true},
  {id:"p3",name:"Gorro Terrazzo",category:"Diseño Exclusivo",price:300,color:"#C8945F",pattern:"Mármol y terrazzo",fabric:"Antimicrobiano transpirable",description:"Estampado tipo terrazzo en tonos arena y miel.",tag:"Nuevo",image:"",available:true},
  {id:"p4",name:"Gorro Terracota",category:"Liso",price:290,color:"#B5654B",pattern:"Terracota cálido",fabric:"Algodón ligero",description:"Color terracota que no se deslava. Banda interior absorbente.",tag:"Popular",image:"",available:true},
  {id:"p5",name:"Gorro Little Stars",category:"Estampado Ilustrado",price:310,color:"#3B4A6B",pattern:"Constelaciones suaves",fabric:"Antifluido de alta densidad",description:"Pensado para pediatría: estrellas pequeñas sobre azul noche.",tag:"Pediatría",image:"",available:true},
  {id:"p6",name:"Gorro Menta Silvestre",category:"Edición Limitada",price:300,color:"#5B8C7E",pattern:"Botánico menta",fabric:"Microfibra quirúrgica suave",description:"Hojas finas en verde menta. Edición limitada.",tag:"Edición limitada",image:"",available:true}
];

var PRODUCTS = [];
var loading = true;
var ui = { view:"shop", cat:"Todos", q:"", cartOpen:false, quick:null, quickQty:1, quickEmb:"", buyerName:"", buyerNote:"" };
var cart = loadCart();
var app = document.getElementById("app");

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function money(n){return "$"+Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2})+" "+CONFIG.currency;}
function moneyShort(n){return "$"+Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2});}
function find(id){return PRODUCTS.find(function(p){return p.id===id;});}
function waDigits(){
  var d=String(CONFIG.whatsapp||"").replace(/\D/g,"");
  if(d.length===13 && d.indexOf("521")===0) d="52"+d.slice(3);
  if(d.length===10) d="52"+d;
  return d;
}
function waLink(text){return "https://wa.me/"+waDigits()+"?text="+encodeURIComponent(text);}
function loadCart(){try{var c=JSON.parse(localStorage.getItem("mc-cart")||"[]");return Array.isArray(c)?c:[];}catch(e){return [];}}
function saveCart(){try{localStorage.setItem("mc-cart",JSON.stringify(cart));}catch(e){}}
function icon(name){
  var p={bag:'<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
    x:'<path d="M6 6l12 12M18 6 6 18"/>', plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
    eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>',
    shield:'<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3z"/><path d="m9 12 2 2 4-4"/>',
    feather:'<path d="M20 4c-6 0-12 4-13 13l-3 3"/><path d="M7 17h7c3 0 5-3 6-7"/>',
    scissors:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5 20 18M8 16.5 20 6"/>',
    wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"/><path d="M9 9.5c.3 2 2.5 4.2 4.5 4.5l1-1.2 1.8.8c-.2 1-1 1.7-2 1.6-3-.3-6-3.3-6.3-6.3-.1-1 .6-1.8 1.6-2l.8 1.8L9 9.5z"/>'}[name];
  return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
}
function capSVG(color,text,grad){
  var fill=grad?"url(#g"+grad+")":esc(color);
  return '<svg viewBox="0 0 200 160" aria-hidden="true">'+
    (grad?'<defs><linearGradient id="g'+grad+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+esc(color)+'"/><stop offset="1" stop-color="#4A3E35"/></linearGradient></defs>':'')+
    '<path d="M30 110C20 60 50 20 100 20s80 40 70 90c-30 10-110 10-140 0z" fill="'+fill+'"/>'+
    '<path d="M28 108c32 10 112 10 144 0 2 14-4 18-12 18-40 4-80 4-120 0-8 0-14-4-12-18z" fill="#000" opacity=".16"/>'+
    '<path d="M160 120c6 8 10 18 8 30M166 118c8 6 14 14 16 26" stroke="'+esc(color)+'" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>'+
    '<circle cx="152" cy="100" r="5" fill="#FAF8F5" stroke="#00000033" stroke-width="1.2"/>'+
    '<circle cx="48" cy="100" r="5" fill="#FAF8F5" stroke="#00000033" stroke-width="1.2"/>'+
    (text?'<text x="100" y="96" fill="#F3EFEA" font-size="9" font-family="Georgia,serif" text-anchor="middle" letter-spacing="1">'+esc(text)+'</text>':'')+
    '</svg>';
}
function visual(p){return p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy">':capSVG(p.color);}

/* ---------- datos ---------- */
function loadStore(){
  fetch("/api/store",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){
      Object.keys(d.settings||{}).forEach(function(k){CONFIG[k]=d.settings[k];});
      PRODUCTS=Array.isArray(d.products)?d.products:[];
      document.title=CONFIG.storeName+" · Gorros quirúrgicos";
    })
    .catch(function(){PRODUCTS=SAMPLE;})
    .then(function(){loading=false;render();});
}

/* ---------- carrito ---------- */
function cartKey(id,emb){return id+"|"+(emb||"");}
function addToCart(id,qty,emb){
  var p=find(id); if(!p||p.available===false) return;
  var k=cartKey(id,emb); var it=cart.find(function(c){return cartKey(c.id,c.emb)===k;});
  if(it) it.qty+=qty; else cart.push({id:id,qty:qty,emb:emb||""});
  saveCart(); ui.cartOpen=true; ui.quick=null; render();
}
function cartLines(){return cart.map(function(c){var p=find(c.id);return p?{c:c,p:p,sub:p.price*c.qty}:null;}).filter(Boolean);}
function cartCount(){return cartLines().reduce(function(s,l){return s+l.c.qty;},0);}
function cartTotal(){return cartLines().reduce(function(s,l){return s+l.sub;},0);}
function orderMessage(){
  var m="Hola, quiero hacer este pedido en "+CONFIG.storeName+":\n\n";
  cartLines().forEach(function(l){
    m+="• "+l.c.qty+" × "+l.p.name+" ("+moneyShort(l.p.price)+" c/u) = "+moneyShort(l.sub)+"\n";
    if(l.c.emb) m+="   Bordado: \""+l.c.emb+"\"\n";
  });
  m+="\nTotal: "+money(cartTotal());
  if(ui.buyerName.trim()) m+="\nNombre: "+ui.buyerName.trim();
  if(ui.buyerNote.trim()) m+="\nComentarios: "+ui.buyerNote.trim();
  return m;
}
function singleMessage(p,qty,emb){
  var m="Hola, me interesa este gorro de "+CONFIG.storeName+":\n\n• "+qty+" × "+p.name+" ("+moneyShort(p.price)+" c/u) = "+moneyShort(p.price*qty);
  if(emb) m+="\n   Bordado: \""+emb+"\"";
  return m+"\n\n¿Está disponible?";
}

/* ---------- render ---------- */
function categories(){var s=[];PRODUCTS.forEach(function(p){if(p.category&&s.indexOf(p.category)<0)s.push(p.category);});return ["Todos"].concat(s);}
function filtered(){
  var q=ui.q.trim().toLowerCase();
  return PRODUCTS.filter(function(p){
    var okC=ui.cat==="Todos"||p.category===ui.cat;
    var hay=(p.name+" "+p.pattern+" "+p.description+" "+p.category).toLowerCase();
    return okC&&(!q||hay.indexOf(q)>=0);
  });
}
function heroTitle(t){
  t=esc(t||"");var w=t.split(" ");if(w.length<4)return t;
  var a=Math.floor(w.length*0.45),b=Math.min(w.length,a+2);
  return w.slice(0,a).join(" ")+" <em>"+w.slice(a,b).join(" ")+"</em> "+w.slice(b).join(" ");
}
function render(){
  var s=CONFIG, h="";
  if(s.announcement) h+='<div class="announce"><div class="wrap">'+esc(s.announcement)+'</div></div>';
  h+='<header class="top"><div class="wrap">'+
    '<nav class="nav" aria-label="Secciones"><button data-a="view" data-v="shop" aria-current="'+(ui.view==="shop")+'">Colección</button><button data-a="view" data-v="about" aria-current="'+(ui.view==="about")+'">Nosotros</button></nav>'+
    '<div class="logo" data-a="view" data-v="shop"><h1>'+esc(s.storeName)+'</h1><p>'+esc(s.tagline)+'</p></div>'+
    '<div class="actions"><button class="bag-btn" data-a="cart-open" aria-label="Abrir bolsa">'+icon("bag")+'<span class="lbl">Bolsa</span>'+(cartCount()?'<span class="count">'+cartCount()+'</span>':'')+'</button></div>'+
    '</div></header>';
  if(ui.view==="shop"){
    var hp=PRODUCTS[0];
    h+='<section class="hero"><div class="wrap"><div><span class="pill"><i></i>'+esc(s.heroBadge)+'</span><h2>'+heroTitle(s.heroTitle)+'</h2><p class="lead">'+esc(s.heroText)+'</p>'+
      '<div class="cta-row"><button class="btn btn-dark" data-a="scroll">Ver catálogo</button><a class="btn btn-line" href="'+esc(waLink("Hola, quiero información sobre gorros personalizados con bordado."))+'" target="_blank" rel="noopener">'+icon("scissors")+' Pedir con bordado</a></div></div>'+
      '<div class="showcase"><div class="ghost"></div><div class="frame"><div class="art">'+
      (hp&&hp.image?'<img src="'+esc(hp.image)+'" alt="" style="width:100%;height:100%;object-fit:cover">':capSVG(hp?hp.color:"#8C7A6B","Dra. Valenzuela","h"))+
      '<div class="caption"><b>'+esc(hp?hp.name:"Gorros quirúrgicos")+'</b><span>Bordado con tu nombre</span></div></div></div></div></div></section>';
    h+='<section class="catalog" id="catalog"><div class="wrap"><div class="cat-head"><div><span class="eyebrow">Catálogo</span><h3>Nuestros gorros</h3></div>'+
      '<div class="filters"><div class="search">'+icon("search")+'<input id="q" type="search" placeholder="Buscar estampado, color…" value="'+esc(ui.q)+'" aria-label="Buscar"></div>'+
      '<div class="chips">'+categories().map(function(c){return '<button class="chip" data-a="cat" data-v="'+esc(c)+'" aria-pressed="'+(ui.cat===c)+'">'+esc(c)+'</button>';}).join("")+'</div></div></div>'+
      '<div id="grid">'+gridHTML()+'</div>'+
      '<div class="benefits"><div>'+icon("shield")+'<h5>Tela antifluido</h5><p>Repele salpicaduras y conserva el tratamiento después de muchos lavados.</p></div>'+
      '<div>'+icon("feather")+'<h5>Cómodo todo el turno</h5><p>Patrón que no aprieta sienes ni frente durante cirugías largas.</p></div>'+
      '<div>'+icon("scissors")+'<h5>Bordado personalizado</h5><p>Tu nombre o especialidad bordado con hilo resistente al cloro.</p></div></div></div></section>';
  } else {
    h+='<section class="wrap"><div class="about"><span class="eyebrow">Nosotros</span><h3>'+esc(s.aboutTitle)+'</h3><p>'+esc(s.aboutText)+'</p><div class="cta-row" style="justify-content:center"><button class="btn btn-dark" data-a="view" data-v="shop">Ver la colección</button></div></div></section>';
  }
  h+='<footer><div class="wrap"><div><h5>'+esc(s.storeName)+'</h5><small>'+esc(s.tagline)+' · '+new Date().getFullYear()+'</small></div><div class="phone"><span style="color:var(--wa)">'+icon("wa")+'</span><span>WhatsApp: '+esc(s.whatsapp)+'</span></div></div></footer>';
  if(ui.cartOpen) h+=cartHTML();
  if(ui.quick) h+=quickHTML();
  var active=document.activeElement, aid=active&&active.id, pos=aid&&active.selectionStart;
  app.innerHTML=h;
  if(aid){var el=document.getElementById(aid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}
function gridHTML(){
  if(loading) return '<div class="empty"><p>Cargando catálogo…</p></div>';
  var list=filtered();
  if(!PRODUCTS.length) return '<div class="empty"><p>Todavía no hay productos en el catálogo.</p></div>';
  if(!list.length) return '<div class="empty"><p>No encontramos gorros con esa búsqueda.</p><button class="link" data-a="reset">Quitar filtros</button></div>';
  return '<div class="grid">'+list.map(function(p){
    var off=p.available===false;
    return '<article class="card" style="--pc:'+esc(p.color)+'"><div class="vis" data-a="quick" data-id="'+esc(p.id)+'">'+(p.tag?'<span class="tag">'+esc(p.tag)+'</span>':'')+(off?'<span class="soldout">Agotado</span>':'')+visual(p)+'</div>'+
      '<div class="info"><div class="row"><div><span class="eyebrow">'+esc(p.category)+'</span><h4>'+esc(p.name)+'</h4></div><span class="price">'+moneyShort(p.price)+'</span></div>'+
      (p.description?'<p class="desc">'+esc(p.description)+'</p>':'')+(p.fabric?'<div class="fabric">'+esc(p.fabric)+'</div>':'')+'</div>'+
      '<div class="foot"><button class="btn btn-line" data-a="add" data-id="'+esc(p.id)+'"'+(off?' aria-disabled="true"':'')+'>'+icon("bag")+(off?' Agotado':' Añadir a la bolsa')+'</button>'+
      '<button class="btn btn-line" data-a="quick" data-id="'+esc(p.id)+'" aria-label="Ver detalle de '+esc(p.name)+'">'+icon("eye")+'</button></div></article>';
  }).join("")+'</div>';
}
function cartHTML(){
  var lines=cartLines();
  var body=lines.length?lines.map(function(l){
    var k=esc(cartKey(l.c.id,l.c.emb));
    return '<div class="line-item"><div class="thumb" style="--pc:'+esc(l.p.color)+'">'+visual(l.p)+'</div><div><h5>'+esc(l.p.name)+'</h5>'+(l.c.emb?'<div class="meta">Bordado: "'+esc(l.c.emb)+'"</div>':'')+
      '<div class="stepper"><button data-a="qty" data-k="'+k+'" data-d="-1" aria-label="Quitar uno">'+icon("minus")+'</button><span>'+l.c.qty+'</span><button data-a="qty" data-k="'+k+'" data-d="1" aria-label="Agregar uno">'+icon("plus")+'</button></div></div>'+
      '<div style="text-align:right"><div class="price" style="font-size:17px">'+moneyShort(l.sub)+'</div><button class="remove" data-a="rm" data-k="'+k+'">Quitar</button></div></div>';
  }).join(""):'<div class="empty" style="margin-top:20px"><p>Tu bolsa está vacía.</p><button class="link" data-a="cart-shop">Ver la colección</button></div>';
  var foot=lines.length?'<div class="d-foot"><div class="total"><span>Total</span><span>'+money(cartTotal())+'</span></div>'+
    '<div class="field"><label for="buyer-name">Tu nombre (opcional)</label><input id="buyer-name" value="'+esc(ui.buyerName)+'" autocomplete="name"></div>'+
    '<div class="field"><label for="buyer-note">Comentarios (talla, entrega…)</label><input id="buyer-note" value="'+esc(ui.buyerNote)+'"></div>'+
    '<a id="wa-order" class="btn btn-wa" href="'+esc(waLink(orderMessage()))+'" target="_blank" rel="noopener">'+icon("wa")+' Pedir por WhatsApp</a>'+
    '<p class="note">Se abre WhatsApp con tu pedido ya escrito; solo tienes que enviarlo. El envío y la forma de pago se acuerdan por ahí.</p></div>':'';
  return '<div class="scrim" data-a="close-all"></div><aside class="drawer" role="dialog" aria-label="Tu bolsa"><div class="d-head"><h4>Tu bolsa</h4><button class="x" data-a="close-all" aria-label="Cerrar">'+icon("x")+'</button></div><div class="d-body">'+body+'</div>'+foot+'</aside>';
}
function quickHTML(){
  var p=find(ui.quick); if(!p) return "";
  var off=p.available===false;
  return '<div class="scrim" data-a="close-all"></div><div class="modal-wrap" data-a="close-bg"><div class="modal" role="dialog" aria-label="'+esc(p.name)+'" style="--pc:'+esc(p.color)+'">'+
    '<button class="x" data-a="close-all" aria-label="Cerrar">'+icon("x")+'</button><div class="vis">'+visual(p)+'</div>'+
    '<div class="content"><span class="eyebrow">'+esc(p.category)+'</span><h4>'+esc(p.name)+'</h4><div class="price" style="font-size:24px">'+money(p.price)+'</div>'+
    (p.description?'<p class="desc">'+esc(p.description)+'</p>':'')+
    '<dl class="specs">'+(p.pattern?'<dt>Diseño</dt><dd>'+esc(p.pattern)+'</dd>':'')+(p.fabric?'<dt>Tela</dt><dd>'+esc(p.fabric)+'</dd>':'')+'<dt>Disponible</dt><dd>'+(off?"Agotado por ahora":"Sí")+'</dd></dl>'+
    (off?'':'<div class="field"><label for="quick-emb">Nombre para bordar (opcional)</label><input id="quick-emb" maxlength="25" placeholder="Ej. Dra. López · Anestesiología" value="'+esc(ui.quickEmb)+'"></div>'+
    '<div style="display:flex;gap:10px;align-items:center"><div class="stepper" style="margin:0"><button data-a="qq" data-d="-1" aria-label="Menos">'+icon("minus")+'</button><span>'+ui.quickQty+'</span><button data-a="qq" data-d="1" aria-label="Más">'+icon("plus")+'</button></div>'+
    '<button class="btn btn-dark" style="flex:1" data-a="add-quick">Añadir a la bolsa</button></div>'+
    '<a id="wa-single" class="btn btn-wa" href="'+esc(waLink(singleMessage(p,ui.quickQty,ui.quickEmb.trim())))+'" target="_blank" rel="noopener">'+icon("wa")+' Preguntar por WhatsApp</a>'+
    '<p class="note">El costo del bordado se confirma por WhatsApp.</p>')+'</div></div></div>';
}

/* ---------- eventos ---------- */
app.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-a]"); if(!t) return;
  if(t.getAttribute("aria-disabled")==="true"){ev.preventDefault();return;}
  switch(t.dataset.a){
    case "view": ui.view=t.dataset.v; render(); window.scrollTo(0,0); break;
    case "scroll": var c=document.getElementById("catalog"); if(c) c.scrollIntoView({behavior:"smooth"}); break;
    case "cat": ui.cat=t.dataset.v; render(); break;
    case "reset": ui.cat="Todos"; ui.q=""; render(); break;
    case "add": addToCart(t.dataset.id,1,""); break;
    case "quick": ui.quick=t.dataset.id; ui.quickQty=1; ui.quickEmb=""; render(); break;
    case "qq": ui.quickQty=Math.max(1,ui.quickQty+Number(t.dataset.d)); render(); break;
    case "add-quick": addToCart(ui.quick,ui.quickQty,ui.quickEmb.trim()); break;
    case "close-bg": if(ev.target===t){ui.quick=null;render();} break;
    case "close-all": ui.cartOpen=false; ui.quick=null; render(); break;
    case "cart-open": ui.cartOpen=true; render(); break;
    case "cart-shop": ui.cartOpen=false; ui.view="shop"; render(); break;
    case "qty": var it=cart.find(function(c){return cartKey(c.id,c.emb)===t.dataset.k;});
      if(it){it.qty+=Number(t.dataset.d); if(it.qty<1) cart.splice(cart.indexOf(it),1);} saveCart(); render(); break;
    case "rm": cart=cart.filter(function(c){return cartKey(c.id,c.emb)!==t.dataset.k;}); saveCart(); render(); break;
  }
});
app.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.id==="q"){ui.q=el.value;var g=document.getElementById("grid");if(g)g.innerHTML=gridHTML();return;}
  if(el.id==="buyer-name"||el.id==="buyer-note"){
    if(el.id==="buyer-name")ui.buyerName=el.value;else ui.buyerNote=el.value;
    var w=document.getElementById("wa-order");if(w)w.href=waLink(orderMessage());return;
  }
  if(el.id==="quick-emb"){ui.quickEmb=el.value;var p=find(ui.quick),ws=document.getElementById("wa-single");if(ws&&p)ws.href=waLink(singleMessage(p,ui.quickQty,ui.quickEmb.trim()));}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&(ui.quick||ui.cartOpen)){ui.quick=null;ui.cartOpen=false;render();}});

render();
loadStore();
})();

</script>
</body>
</html>
