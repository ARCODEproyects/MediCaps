<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administrar · MediCaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: boutique editorial — banda de anuncio, header sticky con logo central, hero a dos columnas, catálogo en rejilla, cajones laterales para bolsa y administración */
:root{
  --bg:#FEFDFB; --surface:#FFFFFF; --band:#F8F5F1; --ink:#2C2A29; --muted:#6E6A66;
  --accent:#8C7A6B; --line:#EDE8E1; --wa:#1E8A52; --danger:#A3412F; --on-ink:#FAF8F5;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Jost", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1817; --surface:#232020; --band:#201D1B; --ink:#EEE8E1; --muted:#A79F97;
  --accent:#C4B09E; --line:#3A3532; --wa:#3DBB78; --danger:#E0816B; --on-ink:#1A1817; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1817; --surface:#232020; --band:#201D1B; --ink:#EEE8E1; --muted:#A79F97;
  --accent:#C4B09E; --line:#3A3532; --wa:#3DBB78; --danger:#E0816B; --on-ink:#1A1817; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--display)}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}

/* anuncio */
.announce{background:var(--ink);color:var(--on-ink);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding-block:9px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:76px;gap:12px}
.nav{display:flex;gap:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.nav button{color:var(--muted);padding-block:4px;border-bottom:1px solid transparent}
.nav button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.logo{text-align:center;cursor:pointer}
.logo h1{font-size:30px;line-height:1;letter-spacing:-.01em}
.logo p{margin:2px 0 0;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.actions{display:flex;justify-content:flex-end;gap:8px}
.bag-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.bag-btn .count{background:var(--accent);color:var(--on-ink);min-width:18px;height:18px;border-radius:9px;font-size:10px;display:grid;place-items:center;font-weight:600;padding:0 5px}
.admin-btn{border:1px dashed var(--accent);color:var(--accent);padding:9px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{background:var(--band);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:7fr 5fr;gap:56px;align-items:center;padding-block:72px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:5px 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero h2{font-size:clamp(38px,5.4vw,64px);line-height:1.06;margin:22px 0 18px}
.hero h2 em{color:var(--accent);font-weight:400}
.hero p.lead{color:var(--muted);max-width:52ch;font-weight:300;margin:0}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);transition:background .25s,color .25s,border-color .25s;text-decoration:none}
.btn-dark{background:var(--ink);color:var(--on-ink)}
.btn-dark:hover{background:var(--accent);border-color:var(--accent)}
.btn-line{color:var(--ink)}
.btn-line:hover{background:var(--surface)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.showcase{position:relative}
.showcase .frame{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);padding:26px}
.showcase .art{aspect-ratio:4/5;max-width:100%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;padding:24px;position:relative}
.showcase .ghost{position:absolute;inset:0;border:1px solid var(--accent);opacity:.45;transform:translate(14px,14px)}
.caption{position:absolute;left:14px;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);padding:10px;text-align:center}
.caption b{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:16px}
.caption span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}

/* catálogo */
.catalog{padding-block:64px}
.cat-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:22px;border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:40px}
.cat-head h3{font-size:clamp(30px,3.4vw,40px);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--accent)}
.search input{background:var(--surface);border:1px solid var(--line);padding:10px 12px 10px 34px;width:230px;max-width:100%;font-size:13px}
.search input:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;transition:box-shadow .3s}
.card:hover{box-shadow:0 18px 40px -24px rgba(44,42,41,.35)}
.card .vis{position:relative;aspect-ratio:4/3;background:color-mix(in srgb,var(--pc) 13%,var(--surface));display:grid;place-items:center;border-bottom:1px solid var(--line);overflow:hidden;cursor:pointer}
.card .vis svg{width:62%;transition:transform .5s}
.card .vis img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .vis svg,.card:hover .vis img{transform:scale(1.05)}
.tag{position:absolute;top:14px;left:14px;background:var(--surface);border:1px solid var(--line);padding:4px 9px;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.soldout{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--on-ink);padding:4px 9px;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.card .info{padding:20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h4{font-size:21px;line-height:1.15;margin-top:2px}
.price{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.card .desc{font-size:13px;color:var(--muted);font-weight:300;margin:0;border-top:1px solid var(--line);padding-top:10px}
.card .fabric{font-family:var(--display);font-style:italic;color:var(--accent);font-size:15px}
.card .foot{padding:0 22px 22px;display:grid;grid-template-columns:1fr auto;gap:8px}
.card .foot .btn{padding:12px 14px}
.empty{border:1px dashed var(--line);background:var(--surface);padding:56px 20px;text-align:center;color:var(--muted)}
.empty p{font-family:var(--display);font-size:20px;margin:0 0 12px}
.link{color:var(--accent);border-bottom:1px solid var(--accent);font-size:11px;letter-spacing:.18em;text-transform:uppercase}

.benefits{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-top:72px}
.benefits div{padding:40px 28px;text-align:center}
.benefits div+div{border-left:1px solid var(--line)}
.benefits .ico{width:24px;height:24px;color:var(--accent);margin-bottom:10px}
.benefits h5{font-family:var(--display);font-size:21px;font-weight:500;margin:0 0 6px}
.benefits p{font-size:13px;color:var(--muted);font-weight:300;margin:0 auto;max-width:34ch}

/* nosotros */
.about{max-width:720px;margin:0 auto;text-align:center;padding-block:80px}
.about h3{font-size:clamp(32px,4.4vw,50px);line-height:1.1;margin:14px 0 22px}
.about p{color:var(--muted);font-weight:300;white-space:pre-line}

footer{background:var(--band);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px;padding-block:40px}
footer h5{font-family:var(--display);font-size:24px;font-weight:500;margin:0}
footer small{color:var(--muted);font-size:12px}
.phone{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;user-select:all}

/* overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(26,24,23,.45);backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(460px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;box-shadow:-20px 0 50px -20px rgba(0,0,0,.35)}
.drawer.wide{width:min(620px,100%)}
.d-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.d-head h4{font-size:24px}
.x{padding:6px}
.d-body{flex:1;overflow-y:auto;padding-block:8px;min-height:0}
.line-item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.thumb{width:56px;height:56px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--pc) 16%,var(--surface))}
.thumb svg{width:80%}.thumb img{width:100%;height:100%;object-fit:cover}
.line-item h5{font-family:var(--display);font-size:17px;font-weight:500;margin:0;line-height:1.2}
.line-item .meta{font-size:11px;color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:6px}
.stepper button{width:28px;height:28px;display:grid;place-items:center}
.stepper span{min-width:24px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.remove{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:underline}
.d-foot{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total span:first-child{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.total span:last-child{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);padding:10px 12px;font-size:14px;width:100%}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.modal-wrap{position:fixed;inset:0;z-index:51;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{position:relative;background:var(--bg);border:1px solid var(--line);width:min(820px,100%);display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.modal .x{position:absolute;top:10px;right:10px}
.modal .vis{aspect-ratio:1;max-width:100%;background:color-mix(in srgb,var(--pc) 13%,var(--surface));border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.modal .vis svg{width:78%}.modal .vis img{width:100%;height:100%;object-fit:cover}
.modal .content{display:flex;flex-direction:column;gap:12px;min-width:0}
.modal h4{font-size:30px;line-height:1.1}
.modal .desc{color:var(--muted);font-weight:300;margin:0;font-size:14px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;border-block:1px solid var(--line);padding-block:10px}
.specs dt{color:var(--muted)}.specs dd{margin:0}

/* admin */
.tabs{display:flex;gap:4px;margin-top:14px}
.tabs button{padding:8px 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.status{font-size:12px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.dirty i{background:#C9852F}.status.ok i{background:var(--wa)}.status.err i{background:var(--danger)}
.adm-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.adm-row .thumb{width:48px;height:48px}
.adm-row b{font-family:var(--display);font-size:17px;font-weight:500;display:block;line-height:1.2}
.adm-row small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.adm-actions{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface);padding:6px 10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.mini.danger{color:var(--danger);border-color:var(--danger)}
.form{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box .thumb{width:72px;height:72px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.badge{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.preview-bar{background:#C9852F;color:#1A1817;text-align:center;font-size:12px;padding-block:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--on-ink);padding:11px 18px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:48px}
  .showcase{max-width:380px;width:100%;margin:0 auto}
  .modal{grid-template-columns:1fr}
  .benefits{grid-template-columns:1fr}
  .benefits div+div{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:640px){
  .top .wrap{grid-template-columns:auto 1fr auto;min-height:64px}
  .nav{gap:12px;font-size:10px;letter-spacing:.12em}
  .logo h1{font-size:23px}
  .logo p{display:none}
  .bag-btn .lbl,.admin-btn .lbl{display:none}
  .bag-btn,.admin-btn{padding:8px 10px}
  .grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .search input{width:100%}
  .search,.filters{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* panel privado */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--band)}
.login-card{background:var(--surface);border:1px solid var(--line);padding:32px;width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.login-card h1{font-size:32px}
.error{color:var(--danger);font-size:13px;margin:0}
.adm-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.adm-top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.adm-top h1{font-size:26px;line-height:1.1}
.adm-main{max-width:820px;padding-block:8px 140px}
.adm-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.mini:disabled{opacity:.35;cursor:default}
.thumb.big{width:96px;height:96px}
.color-in{width:36px;height:32px;padding:0;border:1px solid var(--line);background:none}
.publish-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px -20px rgba(0,0,0,.3)}
.publish-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap;max-width:820px}
.publish-bar .status{flex:1;min-width:220px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var SWATCHES=["#4A5D4E","#8C7A6B","#C8945F","#B5654B","#3B4A6B","#5B8C7E","#2C2A29","#7B5C8E","#C66A84","#4F7FA8"];
var KEY="mc-admin-pass";
var pass=null; try{pass=sessionStorage.getItem(KEY);}catch(e){}
var saved=null, draft=null;
var ui={tab:"products",editing:null,confirmDel:null,status:null,busy:false,uploading:false,loginError:"",loading:false};
var app=document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function dirty(){return draft&&JSON.stringify(draft)!==JSON.stringify(saved);}
function moneyShort(n){return "$"+Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2});}
function uid(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function icon(n){var p={plus:'<path d="M12 5v14M5 12h14"/>',out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'}[n];return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';}
function capSVG(color){return '<svg viewBox="0 0 200 160" aria-hidden="true"><path d="M30 110C20 60 50 20 100 20s80 40 70 90c-30 10-110 10-140 0z" fill="'+esc(color)+'"/><path d="M28 108c32 10 112 10 144 0 2 14-4 18-12 18-40 4-80 4-120 0-8 0-14-4-12-18z" fill="#000" opacity=".16"/></svg>';}
function visual(p){return p.image?'<img src="'+esc(p.image)+'" alt="">':capSVG(p.color);}
function toast(msg){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2800);}
function categories(){var s=[];(draft?draft.products:[]).forEach(function(p){if(p.category&&s.indexOf(p.category)<0)s.push(p.category);});return s;}

function api(method,url,body,type){
  var h={"authorization":"Bearer "+pass};
  if(type) h["content-type"]=type;
  return fetch(url,{method:method,headers:h,body:body,cache:"no-store"}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){
      if(r.status===401){logout("Tu sesión expiró o la contraseña cambió. Entra de nuevo.");throw new Error("401");}
      if(!r.ok) throw new Error(d.error||("Error "+r.status));
      return d;
    });
  });
}

/* ---------- sesión ---------- */
function login(p){
  ui.loginError="";ui.loading=true;render();
  pass=p;
  fetch("/api/login",{method:"POST",headers:{"authorization":"Bearer "+p}}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){
      if(!r.ok) throw new Error(d.error||"No se pudo entrar.");
      try{sessionStorage.setItem(KEY,p);}catch(e){}
      return loadStore();
    });
  }).catch(function(e){pass=null;ui.loading=false;ui.loginError=e.message==="Failed to fetch"?"No hay conexión con el servidor.":e.message;render();});
}
function logout(msg){pass=null;saved=null;draft=null;try{sessionStorage.removeItem(KEY);}catch(e){}ui.loginError=msg||"";ui.loading=false;render();}
function loadStore(){
  return fetch("/api/store",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    saved=d;draft=clone(d);ui.loading=false;ui.status=null;render();
  });
}

/* ---------- guardar ---------- */
function publish(){
  ui.busy=true;ui.status={kind:"",text:"Publicando…"};render();
  api("PUT","/api/store",JSON.stringify(draft),"application/json").then(function(){
    saved=clone(draft);ui.status={kind:"ok",text:"Publicado. La tienda ya muestra los cambios (puede tardar hasta un minuto)."};
  }).catch(function(e){if(e.message!=="401")ui.status={kind:"err",text:e.message};})
  .then(function(){ui.busy=false;render();});
}

/* Reduce la foto a 1200 px y la convierte a JPG para que cargue rápido */
function resizeImage(file){
  return new Promise(function(resolve,reject){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1200,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?resolve(b):reject(new Error("No se pudo procesar la foto."));},"image/jpeg",0.84);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("Ese archivo no parece una imagen."));};
    img.src=url;
  });
}
function uploadPhoto(file){
  ui.uploading=true;render();
  resizeImage(file).then(function(blob){return api("PUT","/api/images/"+uid("img-"),blob,"image/jpeg");})
  .then(function(d){if(ui.editing)ui.editing.image=d.url;toast("Foto lista. Guarda el producto y publica.");})
  .catch(function(e){if(e.message!=="401")toast(e.message);})
  .then(function(){ui.uploading=false;render();});
}

/* ---------- vistas ---------- */
function render(){
  if(!pass||!draft){app.innerHTML=loginHTML();var i=document.getElementById("pw");if(i&&!ui.loading)i.focus();return;}
  var active=document.activeElement,aid=active&&active.id,pos=aid&&active.selectionStart;
  app.innerHTML=adminHTML();
  if(aid){var el=document.getElementById(aid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}
function loginHTML(){
  return '<main class="login"><form id="login-form" class="login-card">'+
    '<span class="eyebrow">Acceso privado</span><h1>Administrar tienda</h1>'+
    '<p class="note">Solo la persona que sube los productos tiene la contraseña.</p>'+
    '<div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>'+
    (ui.loginError?'<p class="error" role="alert">'+esc(ui.loginError)+'</p>':'')+
    '<button class="btn btn-dark" type="submit"'+(ui.loading?' aria-disabled="true"':'')+'>'+(ui.loading?'Entrando…':'Entrar')+'</button>'+
    '<a class="link" href="/" style="align-self:center">Ir a la tienda</a></form></main>';
}
function adminHTML(){
  var d=dirty(),st=ui.status;
  var stCls=st?st.kind:(d?"dirty":""),stTxt=st?st.text:(d?"Tienes cambios sin publicar":"Todo está publicado");
  var h='<header class="adm-top"><div class="wrap"><div><span class="eyebrow">Panel privado</span><h1>'+esc(draft.settings.storeName)+'</h1></div>'+
    '<div class="adm-actions"><a class="mini" href="/" target="_blank" rel="noopener">'+icon("ext")+' Ver tienda</a><button class="mini" data-a="logout">'+icon("out")+' Salir</button></div></div></header>';
  h+='<main class="wrap adm-main"><div class="tabs" role="tablist"><button role="tab" data-a="tab" data-v="products" aria-selected="'+(ui.tab==="products")+'">Productos ('+draft.products.length+')</button><button role="tab" data-a="tab" data-v="settings" aria-selected="'+(ui.tab==="settings")+'">Datos de la tienda</button></div>';
  if(ui.tab==="products") h+=ui.editing?editorHTML():listHTML();
  else h+=settingsHTML();
  h+='</main>';
  h+='<div class="publish-bar"><div class="wrap"><div class="status '+stCls+'" role="status"><i></i>'+esc(stTxt)+'</div>'+
    '<div class="adm-actions"><button class="btn btn-line" data-a="discard"'+(d&&!ui.busy?'':' aria-disabled="true"')+'>Descartar</button>'+
    '<button class="btn btn-dark" data-a="publish"'+(d&&!ui.busy&&!ui.editing?'':' aria-disabled="true"')+'>'+(ui.busy?'Publicando…':'Publicar cambios')+'</button></div></div></div>';
  return h;
}
function listHTML(){
  var h='<div style="padding-block:16px"><button class="btn btn-dark" data-a="new">'+icon("plus")+' Agregar producto</button></div>';
  if(!draft.products.length) return h+'<p class="note">No hay productos. Agrega el primero.</p>';
  return h+draft.products.map(function(p,i){
    var del=ui.confirmDel===p.id;
    return '<div class="adm-row"><div class="thumb" style="--pc:'+esc(p.color)+'">'+visual(p)+'</div>'+
      '<div style="min-width:0"><b>'+esc(p.name)+(p.available===false?'<span class="badge">Agotado</span>':'')+'</b><small>'+moneyShort(p.price)+' · '+esc(p.category)+'</small></div>'+
      '<div class="adm-actions">'+(del?'<button class="mini" data-a="del-no">No</button><button class="mini danger" data-a="del-yes" data-id="'+esc(p.id)+'">Sí, eliminar</button>':
        '<button class="mini" data-a="up" data-i="'+i+'" aria-label="Subir"'+(i===0?' disabled':'')+'>↑</button>'+
        '<button class="mini" data-a="edit" data-id="'+esc(p.id)+'">Editar</button><button class="mini danger" data-a="del" data-id="'+esc(p.id)+'">Eliminar</button>')+'</div></div>';
  }).join("");
}
function editorHTML(){
  var p=ui.editing;
  function f(k,label,type,extra){return '<div class="field"><label for="e-'+k+'">'+label+'</label><input id="e-'+k+'" data-e="'+k+'" type="'+(type||"text")+'" value="'+esc(p[k])+'"'+(extra||"")+'></div>';}
  return '<div class="form">'+
    '<span class="eyebrow">'+(p._new?'Nuevo producto':'Editar producto')+'</span>'+
    f("name","Nombre","text",' maxlength="120"')+
    '<div class="two">'+f("price","Precio ("+esc(draft.settings.currency)+")","number",' min="0" step="1" inputmode="decimal"')+
      '<div class="field"><label for="e-category">Categoría</label><input id="e-category" data-e="category" list="cat-list" value="'+esc(p.category)+'"><datalist id="cat-list">'+categories().map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist></div></div>'+
    '<div class="field"><label for="e-description">Descripción</label><textarea id="e-description" data-e="description" rows="3">'+esc(p.description)+'</textarea></div>'+
    '<div class="two">'+f("pattern","Diseño o estampado")+f("fabric","Tela")+'</div>'+
    f("tag","Etiqueta (ej. Nuevo, Más vendido)")+
    '<div class="field"><label>Foto</label><div class="photo-box"><div class="thumb big" style="--pc:'+esc(p.color)+'">'+visual(p)+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px"><input id="e-photo" type="file" accept="image/*"><span class="note">'+(ui.uploading?'Subiendo foto…':'Desde tu celular puedes tomarla directo. Se ajusta el tamaño sola.')+'</span>'+
      (p.image?'<button class="mini" data-a="rm-photo" style="align-self:flex-start">Quitar foto</button>':'')+'</div></div></div>'+
    '<div class="field"><label>Color de la ilustración (se usa si no hay foto)</label><div class="swatches">'+SWATCHES.map(function(c){return '<button class="swatch" style="background:'+c+'" data-a="color" data-v="'+c+'" aria-pressed="'+(p.color===c)+'" aria-label="Color '+c+'"></button>';}).join("")+
      '<input id="e-color" type="color" value="'+esc(p.color)+'" aria-label="Otro color" class="color-in"></div></div>'+
    '<label class="check"><input id="e-available" type="checkbox"'+(p.available!==false?' checked':'')+'> Disponible para venta</label>'+
    '<div class="two"><button class="btn btn-line" data-a="edit-cancel">Cancelar</button><button class="btn btn-dark" data-a="edit-save"'+(ui.uploading?' aria-disabled="true"':'')+'>Guardar producto</button></div>'+
  '</div>';
}
function settingsHTML(){
  var s=draft.settings;
  function f(k,label,area){return '<div class="field"><label for="s-'+k+'">'+label+'</label>'+(area?'<textarea id="s-'+k+'" data-s="'+k+'" rows="4">'+esc(s[k])+'</textarea>':'<input id="s-'+k+'" data-s="'+k+'" value="'+esc(s[k])+'">')+'</div>';}
  return '<div class="form">'+f("storeName","Nombre de la tienda")+f("tagline","Frase bajo el logo")+
    '<div class="two">'+f("whatsapp","Número de WhatsApp (donde llegan los pedidos)")+f("currency","Moneda")+'</div>'+
    f("announcement","Barra de anuncio (vacía para ocultarla)")+f("heroBadge","Etiqueta de portada")+f("heroTitle","Título de portada")+f("heroText","Texto de portada",true)+
    f("aboutTitle","Título de “Nosotros”")+f("aboutText","Texto de “Nosotros”",true)+'</div>';
}

/* ---------- eventos ---------- */
app.addEventListener("submit",function(ev){
  if(ev.target.id==="login-form"){ev.preventDefault();var v=document.getElementById("pw").value;if(v)login(v);}
});
app.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-a]");if(!t)return;
  if(t.getAttribute("aria-disabled")==="true"){ev.preventDefault();return;}
  switch(t.dataset.a){
    case "logout": logout(); break;
    case "tab": ui.tab=t.dataset.v; ui.editing=null; render(); break;
    case "new": ui.editing={_new:true,id:uid("p"),name:"",category:categories()[0]||"",price:0,color:SWATCHES[0],pattern:"",fabric:"",description:"",tag:"Nuevo",image:"",available:true}; render(); window.scrollTo(0,0); break;
    case "edit": ui.editing=clone(draft.products.find(function(p){return p.id===t.dataset.id;})); render(); window.scrollTo(0,0); break;
    case "edit-cancel": ui.editing=null; render(); break;
    case "edit-save":
      var e=ui.editing;
      if(!String(e.name).trim()){toast("Ponle un nombre al producto.");return;}
      e.name=String(e.name).trim(); e.price=Math.max(0,Number(e.price)||0);
      var isNew=e._new; delete e._new;
      if(isNew) draft.products.push(e); else draft.products=draft.products.map(function(p){return p.id===e.id?e:p;});
      ui.editing=null; ui.status=null; render(); toast("Guardado en el borrador. Dale Publicar cambios para que lo vean tus clientes."); break;
    case "color": ui.editing.color=t.dataset.v; render(); break;
    case "rm-photo": ui.editing.image=""; render(); break;
    case "up": var i=Number(t.dataset.i); if(i>0){var a=draft.products; var x=a[i]; a[i]=a[i-1]; a[i-1]=x; ui.status=null; render();} break;
    case "del": ui.confirmDel=t.dataset.id; render(); break;
    case "del-no": ui.confirmDel=null; render(); break;
    case "del-yes": draft.products=draft.products.filter(function(p){return p.id!==t.dataset.id;}); ui.confirmDel=null; ui.status=null; render(); break;
    case "discard": draft=clone(saved); ui.editing=null; ui.status=null; render(); break;
    case "publish": publish(); break;
  }
});
app.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.dataset.s){draft.settings[el.dataset.s]=el.value;ui.status=null;return;}
  if(el.dataset.e&&ui.editing){ui.editing[el.dataset.e]=el.value;}
});
app.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.dataset.s){render();return;}
  if(!ui.editing)return;
  if(el.id==="e-color"){ui.editing.color=el.value;render();}
  else if(el.id==="e-available"){ui.editing.available=el.checked;}
  else if(el.id==="e-photo"&&el.files&&el.files[0]){uploadPhoto(el.files[0]);}
});
window.addEventListener("beforeunload",function(ev){if(dirty()){ev.preventDefault();ev.returnValue="";}});

if(pass){ui.loading=true;render();loadStore().catch(function(){logout("No se pudo cargar la tienda.");});}
else render();
})();

</script>
</body>
</html>
